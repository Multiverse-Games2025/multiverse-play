<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1113" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    
    <!-- Gradiente Rojo Multiverse -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B30006" />
    </linearGradient>

    <!-- Sombra del Logo -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E50914" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)"/>

  <!-- Logo Isotipo (M + Play) -->
  <g filter="url(#shadow)">
    <!-- Ala Izquierda M -->
    <path d="M 130 140 L 175 140 L 215 230 L 170 230 Z" fill="url(#redGradient)" />
    <!-- Parte Central M/Play -->
    <path d="M 215 230 L 250 140 L 295 140 L 370 230 L 325 230 L 272 170 Z" fill="url(#redGradient)" />
    <!-- Botón Play Integrado -->
    <polygon points="230,180 300,230 230,280" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Texto Multiverse Play -->
  <text x="250" y="380" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    MULTIVERSE
  </text>
  <text x="250" y="425" font-family="'Arial', sans-serif" font-size="28" font-weight="700" fill="#E50914" text-anchor="middle" letter-spacing="8">
    PLAY
  </text>
</svg>
