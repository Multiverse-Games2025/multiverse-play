<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Netflix Personal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

 <!-- Pantalla de Carga (Splash Screen) -->
  <div id="splash-screen">
    <!-- Reemplazamos el h1 por tu imagen personalizada -->
    <img src="logo.jpg" alt="Logo" class="splash-logo-img">
    <div class="loader"></div>
  </div>

  <!-- Pantalla de Login con Código Personal -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Ingresa tu PIN</h2>
      <input type="password" id="pinInput" maxlength="4" placeholder="****">
      <button onclick="verificarPIN()">Entrar</button>
      <p id="error-msg"></p>
    </div>
  </div>

  <!-- Navegación Superior -->
  <nav class="navbar">
    <div class="nav-logo">LOGOTIPO</div>
    <ul class="nav-links">
      <li><a href="#" id="link-inicio" class="active" onclick="mostrarSeccion('inicio')">Inicio</a></li>
      <li><a href="#" id="link-peliculas" onclick="mostrarSeccion('peliculas')">Películas</a></li>
      <li><a href="#" id="link-series" onclick="mostrarSeccion('series')">Series</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <!-- Sección Películas -->
    <section id="sec-peliculas" class="catalog-section">
      <h2>Películas</h2>
      <div class="grid-container">
        <div class="card" onclick="abrirReproductor('ID_DE_YOUTUBE')">
          <img src="CARATULAS/peliculas/tu-pelicula.jpg" alt="Película">
          <div class="card-info">
            <h3>Nombre Película</h3>
          </div>
        </div>
      </div>
    </section>

    <!-- Sección Series -->
    <section id="sec-series" class="catalog-section">
      <h2>Series</h2>
      <div class="grid-container">
        <!-- Al hacer clic se abre el panel de capítulos -->
        <div class="card" onclick="abrirCapitulos('Saint Seiya: Lost Canvas')">
          <img src="CARATULAS/series/tlostcanvas.png" alt="Saint Seiya">
          <div class="card-info">
            <h3>Saint Seiya: Lost Canvas</h3>
            <p>2 Temporadas</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Selector de Capítulos -->
  <div id="episodesModal" class="modal">
    <div class="episodes-content">
      <span class="close-btn" onclick="cerrarCapitulos()">&times;</span>
      <h2 id="seriesTitle">Nombre de la Serie</h2>
      <div class="episodes-list">
        <!-- Lista de episodios -->
        <div class="episode-item" onclick="abrirReproductor('4pIw2LQkpdI')">
          <span class="ep-num">1</span>
          <div class="ep-info">
            <h4>Capítulo 1: La estrella de la profecía</h4>
            <p>24 min</p>
          </div>
        </div>
        
        <div class="episode-item" onclick="abrirReproductor('OTRO_ID_YOUTUBE')">
          <span class="ep-num">2</span>
          <div class="ep-info">
            <h4>Capítulo 2: El despertar de Hades</h4>
            <p>24 min</p>
          </div>
        </div>
      </div>
    </div>
  </div>

      <!-- Puedes duplicar más tarjetas de series según necesites -->

    </div>
  </section>

  <!-- Ventana Flotante / Modal para el Reproductor Fullscreen -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarReproductor()">&times;</span>
      <iframe id="youtubeIframe" src="" title="Reproductor" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
